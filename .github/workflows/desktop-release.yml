name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  build-mac:
    name: Build macOS desktop app
    runs-on: macos-15

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron/package-lock.json

      - name: Install web dependencies
        run: npm install

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Validate macOS signing secrets
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          test -n "$CSC_LINK" || (echo "Missing CSC_LINK secret" && exit 1)
          test -n "$CSC_KEY_PASSWORD" || (echo "Missing CSC_KEY_PASSWORD secret" && exit 1)
          test -n "$APPLE_ID" || (echo "Missing APPLE_ID secret" && exit 1)
          test -n "$APPLE_APP_PASSWORD" || (echo "Missing APPLE_APP_PASSWORD secret" && exit 1)

      - name: Build and publish desktop release
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: npm run electron:make
